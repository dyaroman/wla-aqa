trigger:
  branches:
    include:
      - main
      - development
      - feature/*

pool:
  vmImage: 'ubuntu-24.04'

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: NodeTool@0
            displayName: 'Use node 22.14.x'
            inputs:
              versionSpec: 22.14.x
              checkLatest: true

          - checkout: self
            displayName: 'Checkout'

          - script: npm pkg delete scripts.prepare
            displayName: 'Remove prepare script'

          - script: npm ci --omit=dev
            displayName: 'Install dependencies'

          - script: npm run build
            displayName: 'Build'

          - task: ArchiveFiles@2
            displayName: 'Archive build'
            inputs:
              rootFolderOrFile: '$(Build.SourcesDirectory)/dist'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'

          - publish: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
            artifact: drop
            displayName: 'Publish artifact'

  - stage: Deploy
    dependsOn: Build
    jobs:
      - deployment: aqa
        displayName: 'Release to dyaroman.github.io/wla-aqa'
        environment: deploy-dev.wla-e2e-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop
                  patterns: '$(Build.BuildId).zip'
                  displayName: 'Download artifact'

                - task: IISWebAppDeploymentOnMachineGroup@0
                  inputs:
                    webSiteName: 'dyaroman.github.io/wla-aqa'
                    package: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'
